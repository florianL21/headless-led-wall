[package]
name = "headless-display-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
jsonschema = "0.49.6"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt", "sync", "signal"] }
interface = { path = "../interface", default-features = false, features = [
    "server",
] }
postcard = { version = "1.1.3", default-features = false, features = [
    "alloc",
    "use-std",
] }
reqwest = { version = "0.13.4", features=["query"] }
log = { version = "0.4.33", features = [ "std" ] }
env_logger = "0.11.11"
chrono = "0.4.45"
icu_casemap = "2.2.0"
icu_locale_core = "2.2.0"
tokio-util = "0.7.19"
static_cell = "2.1.1"
toml = "1.1.4+spec-1.1.0"
indicatif = "0.18.6"
