[package]
edition = "2024"
name = "headless-display"
rust-version = "1.93"
version = "0.1.0"

[[bin]]
name = "headless-display"
path = "./src/bin/main.rs"

[dependencies]
esp-bootloader-esp-idf = { version = "0.5.0" }
esp-hal = { version = "1.1.2", features = ["log-04", "unstable"] }
log = "0.4.33"
embassy-net = { version = "0.9.1", features = [
    "dhcpv4",
    "log",
    "medium-ethernet",
    "tcp",
    "udp",
] }
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
esp-alloc = { version = "0.10.0" }
esp-backtrace = { version = "0.19.0", features = ["panic-handler", "println"] }
esp-println = { version = "0.17.0", features = ["log-04"] }
# for more networking protocol support see https://crates.io/crates/edge-net
critical-section = "1.2.0"
embassy-executor = { version = "0.10.0", features = ["log", "nightly"] }
embassy-time = { version = "0.5.1", features = ["log"] }
esp-rtos = { version = "0.3.0", features = [
    "embassy",
    "esp-alloc",
    "esp-radio",
    "log-04",
] }
esp-radio = { version = "1.0.0-beta.0", features = [
    "esp-alloc",
    "log-04",
    "unstable",
    "wifi",
] }
smoltcp = { version = "0.13.1", default-features = false, features = [
    "log",
    "medium-ethernet",
    "multicast",
    "proto-dhcpv4",
    "proto-dns",
    "proto-ipv4",
    "socket-dns",
    "socket-icmp",
    "socket-raw",
    "socket-tcp",
    "socket-udp",
] }
static_cell = { version = "2.1.1" }
embedded-graphics = "0.8.2"
esp-hub75 = { version = "0.14.0", features = ["iram"] }
hub75-framebuffer = { version = "0.11.0" }
embassy-sync = "0.8.0"
heapless = "0.9.3"
tinyqoi = "0.2.0"
embedded-layout = "0.4.2"
picoserve = { version = "0.18.0", features = ["alloc", "embassy", "log"] }
serde = { version = "1.0.229", default-features = false, features = [
    "alloc",
    "derive",
] }
interface = { path = "../interface" }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
thiserror = { version = "2.0.19", default-features = false }
esp-storage = { version = "0.9.0", features = ["critical-section"] }
embassy-embedded-hal = "0.6.0"
ekv = { git = "https://github.com/embassy-rs/ekv.git", rev = "a0e2c7e" }
embedded-storage = "0.3.1"
static-toml = "1.3.0"
cfg-if = "1.0.4"
average = "0.17.0"

[features]
default = []
esp32c6 = [
    "esp-storage/esp32c6",
    "esp-hub75/esp32c6",
    "esp-radio/esp32c6",
    "esp-rtos/esp32c6",
    "esp-println/esp32c6",
    "esp-backtrace/esp32c6",
    "esp-hal/esp32c6",
    "esp-bootloader-esp-idf/esp32c6",
]
esp32s3 = [
    "esp-storage/esp32s3",
    "esp-hub75/esp32s3",
    "esp-hub75/full-chain-dma",
    "esp-hub75/circular-dma",
    "esp-radio/esp32s3",
    "esp-rtos/esp32s3",
    "esp-println/esp32s3",
    "esp-backtrace/esp32s3",
    "esp-hal/esp32s3",
    "esp-bootloader-esp-idf/esp32s3",
    "esp-backtrace/semihosting",
]
psram = []

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units = 1        # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false

