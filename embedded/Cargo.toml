[package]
edition = "2021"
name = "headless-display"
rust-version = "1.86"
version = "0.1.0"

[[bin]]
name = "headless-display"
path = "./src/bin/main.rs"

[dependencies]
esp-bootloader-esp-idf = { version = "0.4.0" }
esp-hal = { version = "~1.0", features = ["log-04", "unstable"] }
log = "0.4.27"
embassy-net = { version = "0.8.0", features = [
  "dhcpv4",
  "log",
  "medium-ethernet",
  "tcp",
  "udp",
] }
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
esp-alloc = "0.9.0"
esp-backtrace = { version = "0.18.1", features = [
  "panic-handler",
  "println",
  "semihosting",
] }
esp-println = { version = "0.16.1", features = ["log-04"] }
# for more networking protocol support see https://crates.io/crates/edge-net
critical-section = "1.2.0"
embassy-executor = { version = "0.9.1", features = ["log", "nightly"] }
embassy-time = { version = "0.5.0", features = ["log"] }
esp-rtos = { version = "0.2.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "log-04",
] }
esp-radio = { version = "0.17.0", features = [
  "esp-alloc",
  "log-04",
  "smoltcp",
  "unstable",
  "wifi",
] }
smoltcp = { version = "0.12.0", default-features = false, features = [
  "log",
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  "socket-dns",
  "socket-icmp",
  "socket-raw",
  "socket-tcp",
  "socket-udp",
] }
static_cell = { version = "2.1.1", features = ["nightly"] }
embedded-graphics = "0.8.1"
esp-hub75 = { version = "0.8.0", features = ["iram"] }
hub75-framebuffer = { version = "0.6.0" }
embassy-sync = "0.7.0"
heapless = "0.9.2"
tinyqoi = "0.2.0"
embedded-layout = "0.4.2"
picoserve = { version = "0.18.0", features = ["alloc", "embassy", "log"] }
serde = { version = "1.0.219", default-features = false, features = [
  "alloc",
  "derive",
] }
interface = { path = "../interface" }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
thiserror = { version = "2.0.12", default-features = false }
esp-storage = { version = "0.8.1", features = ["critical-section"] }
embassy-embedded-hal = "0.5.0"
ekv = { git = "https://github.com/embassy-rs/ekv.git", rev = "b68fd9a" }
embedded-storage = "0.3.1"
static-toml = "1.3.0"

[features]
default = ["esp32c6"]
esp32c6 = [
  "esp-storage/esp32c6",
  "esp-hub75/esp32c6",
  "esp-radio/esp32c6",
  "esp-rtos/esp32c6",
  "esp-println/esp32c6",
  "esp-backtrace/esp32c6",
  "esp-hal/esp32c6",
  "esp-bootloader-esp-idf/esp32c6",
]
esp32s3 = [
  "esp-storage/esp32s3",
  "esp-hub75/esp32s3",
  "esp-radio/esp32s3",
  "esp-rtos/esp32s3",
  "esp-println/esp32s3",
  "esp-backtrace/esp32s3",
  "esp-hal/esp32s3",
  "esp-hal/psram",
  "esp-bootloader-esp-idf/esp32s3",
]

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units = 1        # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false
