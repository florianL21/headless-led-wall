<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTA Update</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1c1c1c, #4a4a4a);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: white;
            overflow: hidden;
            position: relative;
            overflow: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 100%;
            max-width: 400px;
            position: relative;
            z-index: 2;
            /* Above the light */
        }

        h1 {
            margin-bottom: 1.5rem;
            font-size: 2rem;
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.7);
            color: #dddedd;
            /* Neon color */
        }

        .file-input {
            position: relative;
            margin: 1rem 0;
            width: 100%;
        }

        input[type="file"] {
            display: none;
        }

        label {
            display: block;
            background-color: #28a745;
            color: white;
            padding: 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s, box-shadow 0.3s;
            font-size: 1rem;
            width: 100%;
            text-align: center;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
            z-index: 1;
            /* Above the light */
        }

        label:hover {
            background-color: #218838;
            box-shadow: 0 0 20px #28a745, 0 0 40px #28a745;
            /* Glowing effect on hover */
        }

        input[type="submit"] {
            background-color: #007BFF;
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.3s, box-shadow 0.3s;
            width: 100%;
            margin-top: 1rem;
            box-sizing: border-box;
            position: relative;
            z-index: 1;
            /* Above the light */
        }

        input[type="submit"]:hover {
            background-color: #0056b3;
            box-shadow: 0 0 20px #007BFF, 0 0 40px #007BFF;
            /* Glowing effect on hover */
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Upload your update binary</h1>
        <form enctype="multipart/form-data" method="post">
            <div class="file-input">
                <input name="f" type="file" id="file-upload" required>
                <label for="file-upload">Choose File</label>
            </div>
            <input type="submit" value="Update">
        </form>
    </div>

</body>

</html>
